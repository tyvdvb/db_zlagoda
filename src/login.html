<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zlagoda</title>
    <link href="css/bootstrap-4.4.1.css" rel="stylesheet">
    <link href="css/index.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>

</head>
<body style="background-color: #6b805f">

<main class="form-signin text-white">
    <form>
        <a href="index.html"><img class="mb-4" src="images/shopping.png" alt="Zlagoda logo" height="100px" title="Home page"></a>
        <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

        <div class="form-floating my-2">
            <input type="text" class="form-control" id="floatingInput" placeholder="Worker ID">
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
        </div>
        <a href="index.html" class="w-100 btn btn-lg btn-danger text-white" type="submit">Sign in</a>
    </form>
</main>

</body>
</html>
