
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zlagoda</title>
  <link href="../../css/bootstrap-4.4.1.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

</head>
<body style="background-color: #6b805f">
<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger text-white">
    <div class="container-fluid">
      <img class="mr-3" src="../../images/shopping.png" style="height: 100px" title="Zlagoda" alt="logo">
      <h1 class="navbar-brand ">Zlagoda</h1>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">
            <a class="nav-link" href="delete_store_product.html">Delete product in store</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../manager.html">Home</a>
          </li>
        </ul>
        <form class="form-inline my-2 my-lg-0">
			  <span class="badge-lg badge-pill badge-red">Logged in as:
				  <a href="#" id="workerID"> @workerID@ </a>
			  </span>
        </form>
      </div>
    </div>
  </nav>
</header>
<main>
  <div class="container">
    <br>
    <h1 class="text-center"><span class="badge-lg badge-pill badge-danger">Product</span></h1>
    <br>
    <h3>UPC: <span id="upc">@upc@</span></h3>
    <br>
    <h3>Product ID: <span id="productID">@productID@</span></h3>
    <br>
    <h3>Product name: <span id="name">@productName@</span></h3>
    <br>
    <h3>Selling price: <span id="price">@price@</span></h3>
    <br>
    <h3>Discount: <span id="dicount">@dicount@</span></h3>
    <br>
    <h3>Amount in store: <span id="amount">@amount@</span></h3>
    <hr>
    <h2><span class="badge-lg badge-pill badge-danger">Choose amount to delete</span></h2>
    <br>
    <form>
      <div class="form-floating">
        <input type="number" class="form-control" id="amountDelete" placeholder="Amount to delete" min="1">
      </div>

    </form>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <button class="w-100 btn btn-lg btn-danger text-white">Delete</button>
  </div>
</main>
