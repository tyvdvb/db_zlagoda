
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zladoga</title>
    <link href="../../css/bootstrap-4.4.1.css" rel="stylesheet">
    <link href="../../css/index.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

</head>
<body style="background-color: #6b805f">
<main class="form-signin text-white">
    <form>
        <a href="../manager.html"><img class="mb-4" src="../../images/shopping.png" alt="Zlagoda logo" height="100px" title="Back"></a>
        <h1 class="h3 mb-3 fw-normal"><span class="badge badge-pill badge-danger">Update product</span></h1>
        <div class="form-floating">
            <h6><span class="badge badge-pill badge-danger">Product ID</span></h6>
            <p>@productID@</p>
        </div>
        <br>
        <div class="form-floating">
            <h6><span class="badge badge-pill badge-danger">Category</span></h6>
            <select class="form-control">
                <option selected>Category....</option>
                <option value="@categoryName@">@categoryName@</option>
            </select>
        </div>
        <br>
        <div class="form-floating">
            <h6><span class="badge badge-pill badge-danger">Product name</span></h6>
            <input type="text" class="form-control" id="productName" placeholder="Product name">
        </div>
        <br>
        <div class="form-floating">
            <h6><span class="badge badge-pill badge-danger">Product description</span></h6>
            <textarea maxlength="100" rows="5" type="text" class="form-control" id="productDescription" placeholder="Product description" style="resize: none"></textarea>
        </div>
        <br>
        <button class="w-100 btn btn-lg btn-danger text-white" type="submit">Submit</button>




    </form>
</main>

</body>
</html>
