            <img class="mr-3" src="../../images/shopping.png" style="height: 100px" title="Zlagoda" alt="logo">
            <h1 class="navbar-brand ">Zlagoda</h1>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="delete_client.html">Delete client`s card</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../manager.html">Home</a>
                    </li>
                </ul>
                <form class="form-inline my-2 my-lg-0">
			  <span class="badge-lg badge-pill badge-red">Logged in as:
				  <a href="#" id="workerID"> @workerID@ </a>
			  </span>
                </form>
            </div>
        </div>
    </nav>
</header>
<main>
    <div class="container">
        <br>
        <h1 class="text-center"><span class="badge-lg badge-pill badge-danger">Profile</span></h1>
        <br>
        <h3>Card ID: <span id="cardID">@cardID@</span></h3>
        <br>
        <h3>Name: <span id="name">@name@</span></h3>
        <br>
        <h3>Surname: <span id="surname">@surname@</span></h3>
        <br>
        <h3>Patronymic: <span id="patronymic">@patronymic@</span></h3>
        <br>
        <h3>Phone number: <span id="phone">@phone@</span></h3>
        <br>
        <h3>Discount: <span id="discount">@discount@</span></h3>
        <br>
        <h2 class="text-center"><span class="badge-lg badge-pill badge-danger">Address</span></h2>
        <h3>City: <span id="city">@city@</span></h3>
        <br>
        <h3>Street: <span id="street">@street@</span></h3>
        <br>
        <h3>Zip code: <span id="zip">@zip@</span></h3>
        <br>
        <br>
        <br>
        <br>
        <br>
        <br>
        <button class="w-100 btn btn-lg btn-danger text-white">Delete</button>
    </div>
</main>
