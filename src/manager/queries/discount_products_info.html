<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zlagoda</title>
    <link href="../../css/bootstrap-4.4.1.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>


</head>
<body style="background-color: #6b805f">
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger text-white">
        <div class="container-fluid">
            <img class="mr-3" src="../../images/shopping.png" style="height: 100px" title="Zlagoda" alt="logo">
                <h1 class="navbar-brand ">Zlagoda</h1>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="discount_products_info.html">Discount products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../manager_queries.html">Manager Queries</a>
                    </li>
                </ul>
                <form class="form-inline my-2 my-lg-0">
                        <span class="badge-lg badge-pill badge-red">Logged in as:
				  <a href="../../user.html" id="workerID"> @workerID@ </a>
			  </span>
                </form>
            </div>
        </div>
    </nav>
</header>
<main>
    <br>
    <h1 class="text-center"><span class="badge badge-pill text-white badge-danger">Products with Discount</span></h1>
    <br>
    <br>
    <h3 class="text-start"><span class="badge badge-pill text-white badge-danger">Sort</span></h3>
    <br>
    <select class="form-select" aria-label="select">
        <option selected>Sort by</option>
        <option value="@units@">@units@</option>
        <option value="@name@">@name@</option>
    </select>
    <br><br>

    <div class="row text-center text-white">
        <div class="col-2 col-lg-11 col-xl-2">
            <h3><span class="badge badge-pill badge-danger">Product ID</span></h3>
        </div>
        <div class="col-2 col-lg-11 col-xl-2">
            <h3><span class="badge badge-pill badge-danger">Name</span></h3>
        </div>
        <div class="col-2 col-lg-11 col-xl-2">
            <h3><span class="badge badge-pill badge-danger">Category</span></h3>
        </div>
    </div>
    <div class="text-white">
        <br>
        <div class="card bg-danger">
            <div class="card-header">
                <div class="row text-center">
                    <div class="col-2 col-lg-11 col-xl-2">@productID@</div>
                    <div class="col-2 col-lg-11 col-xl-2">@name@</div>
                    <div class="col-2 col-lg-11 col-xl-2">@category@</div>
                </div>
            </div>
        </div>
        <br>
    </div>
</main>
<br>
<br>
